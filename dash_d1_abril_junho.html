<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333}
header{background:#009ee3;color:#fff;padding:20px 32px}
header h1{font-size:1.35rem;font-weight:700}
header p{font-size:.82rem;opacity:.85;margin-top:4px}
.container{max-width:1300px;margin:0 auto;padding:24px 32px}
.filter-bar{background:#fff;border-radius:12px;padding:16px 22px;margin-bottom:22px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-bar label{font-weight:600;font-size:.88rem;color:#555;white-space:nowrap}
.filter-bar select{padding:8px 14px;border:1.5px solid #ddd;border-radius:8px;
  font-size:.9rem;min-width:150px;cursor:pointer;outline:none;background:#fff}
.filter-bar select:focus{border-color:#009ee3}
.sep{width:1px;height:28px;background:#e5e7eb;margin:0 4px}

.funnel-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.funnel-card{background:#fff;border-radius:12px;padding:24px;
  box-shadow:0 1px 4px rgba(0,0,0,.07)}
.funnel-card h2{font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:18px;
  padding-bottom:12px;border-bottom:2px solid #f3f4f6}
.f-apr h2{color:#009ee3}
.f-jun h2{color:#f0711a}

.funnel-step{margin-bottom:16px}
.step-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.step-label{font-size:.78rem;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.05em}
.step-nums{text-align:right}
.step-count{font-size:1rem;font-weight:800;color:#111}
.step-pct{font-size:.75rem;color:#aaa;display:block;margin-top:1px}
.bar-track{height:12px;background:#f3f4f6;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
.b-enc  {background:#9ca3af}
.b-sent {background:#8b5cf6}
.b-arr  {background:#009ee3}
.b-shown{background:#00b89a}
.b-open {background:#f59e0b}
.b-conv {background:#10b981}
.step-divider{height:8px}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.kpi-card{background:#fff;border-radius:12px;padding:14px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-label{font-size:.68rem;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi-vals{display:flex;justify-content:space-around;align-items:center}
.kpi-v{text-align:center}
.kpi-v .num{font-size:1.05rem;font-weight:800}
.kpi-v .sub{font-size:.65rem;color:#bbb;margin-top:1px}
.kpi-apr .num{color:#009ee3}
.kpi-jun .num{color:#f0711a}
.kpi-delta{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:10px}
.d-up{background:#d1fae5;color:#065f46}
.d-dn{background:#fee2e2;color:#991b1b}
.d-eq{background:#f3f4f6;color:#6b7280}

.chart-section{background:#fff;border-radius:12px;padding:20px 22px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:22px}
.chart-section h3{font-size:.88rem;font-weight:700;color:#555;margin-bottom:16px}
.chart-md{position:relative;height:260px}
.charts-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}

@media(max-width:900px){
  .funnel-wrap,.kpi-row,.charts-2col{grid-template-columns:1fr}
}
</style>

const fmt  = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const fmtN = n => n.toLocaleString('pt-BR');
const pctN = (a, b) => b > 0 ? (a/b)*100 : 0;

function filter() {
  const camp = document.getElementById('selCampaign').value;
  const seg  = document.getElementById('selSeg').value;
  const tc   = document.getElementById('selTc').value;
  const app  = document.getElementById('selApp').value;
  const ea   = document.getElementById('selEa').value;
  return DATA.filter(d =>
    (!camp || d.campaign === camp) &&
    (!seg  || d.segmento === seg)  &&
    (!tc   || d.flag_tc === tc)    &&
    (!app  || d.flag_app_ativo === app) &&
    (!ea   || d.flag_ea === ea)
  );
}

function aggRows(rows) {
  const o = { sent:0, arr:0, shown:0, open:0, conv:0 };
  rows.forEach(d => {
    o.sent  += d.qtd_sent;
    o.arr   += d.qtd_arrived;
    o.shown += d.qtd_shown;
    o.open  += d.qtd_open;
    o.conv  += d.qtd_conv_shown;
  });
  return o;
}

function aggEnc(rows) {
  const map = {};
  rows.forEach(d => {
    const k = `${d.flag_app_ativo}|${d.flag_tc}|${d.segmento}`;
    if (!map[k]) map[k] = d.qtd_total_encendido;
  });
  return Object.values(map).reduce((s,v) => s+v, 0);
}

function buildFunnel(el, title, enc, a, colorClass) {
  const steps = [
    { lbl:'🔥 Encendido', val:enc,    w:100,                   sub:'base', cls:'b-enc'  },
    { lbl:'📤 Sent',      val:a.sent,  w:pctN(a.sent, enc),     sub:`${pctN(a.sent,enc).toFixed(1)}% de enc`, cls:'b-sent'  },
    { lbl:'📬 Arrived',   val:a.arr,   w:pctN(a.arr,  enc),     sub:`${pctN(a.arr,enc).toFixed(1)}% de enc`,  cls:'b-arr'   },
    { lbl:'👀 Shown',     val:a.shown, w:pctN(a.shown,enc),     sub:`${pctN(a.shown,enc).toFixed(1)}% de enc`,cls:'b-shown' },
    { lbl:'👆 Open',      val:a.open,  w:pctN(a.open, a.shown), sub:`${pctN(a.open,a.shown).toFixed(1)}% de shown`, cls:'b-open' },
    { lbl:'✅ Convertido', val:a.conv,  w:pctN(a.conv, a.shown), sub:`${pctN(a.conv,a.shown).toFixed(1)}% de shown`, cls:'b-conv' },
  ];
  let html = `<h2>${title}</h2>`;
  steps.forEach(s => {
    const barW = Math.max(1.5, Math.min(100, s.w));
    html += `<div class="funnel-step">
      <div class="step-header">
        <span class="step-label">${s.lbl}</span>
        <span class="step-nums">
          <span class="step-count">${fmtN(s.val)}</span>
          <span class="step-pct">${s.sub}</span>
        </span>
      </div>
      <div class="bar-track"><div class="bar-fill ${s.cls}" style="width:${barW}%"></div></div>
    </div>`;
  });
  el.innerHTML = html;
}

function buildKPIs(aA, eA, aJ, eJ) {
  const metrics = [
    { lbl:'% Sent / Enc',    vA:pctN(aA.sent,eA),    vJ:pctN(aJ.sent,eJ)    },
    { lbl:'% Arrived / Enc', vA:pctN(aA.arr,eA),     vJ:pctN(aJ.arr,eJ)     },
    { lbl:'% Shown / Enc',   vA:pctN(aA.shown,eA),   vJ:pctN(aJ.shown,eJ)   },
    { lbl:'% Open / Shown',  vA:pctN(aA.open,aA.shown), vJ:pctN(aJ.open,aJ.shown) },
    { lbl:'% Conv / Shown',  vA:pctN(aA.conv,aA.shown), vJ:pctN(aJ.conv,aJ.shown) },
  ];
  document.getElementById('kpiRow').innerHTML = metrics.map(m => {
    const diff = m.vJ - m.vA;
    const cls  = diff > 0.05 ? 'd-up' : diff < -0.05 ? 'd-dn' : 'd-eq';
    const sign = diff > 0 ? '+' : '';
    return `<div class="kpi-card">
      <div class="kpi-label">${m.lbl}</div>
      <div class="kpi-vals">
        <div class="kpi-v kpi-apr"><div class="num">${m.vA.toFixed(1)}%</div><div class="sub">Abril</div></div>
        <span class="kpi-delta ${cls}">${sign}${diff.toFixed(1)}pp</span>
        <div class="kpi-v kpi-jun"><div class="num">${m.vJ.toFixed(1)}%</div><div class="sub">Junho</div></div>
      </div>
    </div>`;
  }).join('');
}

let charts = {};
function mkChart(id, labels, dsA, dsJ, suffix) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type:'bar',
    data:{
      labels,
      datasets:[
        { label:'Abril 2026', data:dsA, backgroundColor:'#009ee3', borderRadius:5 },
        { label:'Junho 2026', data:dsJ, backgroundColor:'#f0711a', borderRadius:5 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'top'},
        tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(1)}${suffix}` }}},
      scales:{ y:{ ticks:{ callback: v => v+suffix }, grid:{ color:'#f3f4f6' } } }
    }
  });
}

function render() {
  const all  = filter();
  const rowA = all.filter(d => d.anomes_encendido === '202604');
  const rowJ = all.filter(d => d.anomes_encendido === '202606');
  const eA = aggEnc(rowA), eJ = aggEnc(rowJ);
  const aA = aggRows(rowA), aJ = aggRows(rowJ);

  buildFunnel(document.getElementById('funnelAbr'), 'Abril 2026', eA, aA);
  buildFunnel(document.getElementById('funnelJun'), 'Junho 2026', eJ, aJ);
  buildKPIs(aA, eA, aJ, eJ);

  mkChart('rateChart',
    ['% Sent', '% Arrived', '% Shown'],
    [pctN(aA.sent,eA), pctN(aA.arr,eA), pctN(aA.shown,eA)],
    [pctN(aJ.sent,eJ), pctN(aJ.arr,eJ), pctN(aJ.shown,eJ)], '%');

  mkChart('convChart',
    ['% Open / Shown', '% Conv / Shown'],
    [pctN(aA.open,aA.shown), pctN(aA.conv,aA.shown)],
    [pctN(aJ.open,aJ.shown), pctN(aJ.conv,aJ.shown)], '%');
}

render();
</script>
</body>
</html>
